server {
    listen 80;
    server_name _;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Enforced baseline. External hosts are exactly the ones the frontend loads:
    # Goong map tiles/REST + the DiaGioiHanhChinhVN provinces JSON on
    # raw.githubusercontent.com. 'unsafe-inline' is required by Next.js inline
    # hydration scripts and emotion/MUI injected styles (no nonce support at this layer).
    add_header Content-Security-Policy "default-src 'self' https://tiles.goong.io https://rsapi.goong.io https://raw.githubusercontent.com data: blob: 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # Strict policy, not yet browser-validated — runs in Report-Only until it can be
    # confirmed against the live app, then promote it to the enforced header above
    # (script-src without 'unsafe-inline' needs Next.js nonces; see docs/REMEDIATION.md).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.goong.io; connect-src 'self' https://tiles.goong.io https://rsapi.goong.io https://raw.githubusercontent.com; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Chatbot worst-case request work is < 90s — cut at 95s so the edge never
    # outlives the service budget (must stay <= 100s).
    proxy_read_timeout 95s;
    proxy_send_timeout 95s;

    # Next.js server-side map proxies live under /api/* on the frontend, not the
    # Nest backend. Regex locations beat the /api/ prefix below, so these four
    # route to frontend:4000; everything else under /api/ stays with the backend.
    location ~ ^/api/(geocoding|geocode|places|direction)(/|$) {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

